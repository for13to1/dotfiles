# _scripts/eco.conf — 生态 CLI 清单（eco 的唯一数据源）
#
# 一行一工具: <渠道> <默认> <bin> <pkg> [flag]
#   渠道: node | py | go | rust
#   默认: y=缺失即装、不问; n=交互时询问、非交互跳过
#   bin : 用户敲的命令名，必须是包真实提供的可执行文件
#   pkg : npm 包 / pip 包 / go module 路径 / cargo crate
#   flag: 透传参数，不得含空格；仅 node 与 rust 支持
#
# 加载即校验：渠道白名单、重复 bin、同渠道重复 pkg、bin 含空格或 /、flag 含空格、给 py/go 写 flag。

# ── node（npm）──────────────────────────────────────────────────
node y biome     @biomejs/biome
node y stylua    @johnnymorganz/stylua-bin
node n pi        @earendil-works/pi-coding-agent   --ignore-scripts
node n codex     @openai/codex
node n opencode  opencode-ai                       --allow-scripts=opencode-ai
node n mimo      @mimo-ai/cli                      --allow-scripts=@mimo-ai/cli
node n codegraph @colbymchenry/codegraph
node n wrangler  wrangler                          --allow-scripts=esbuild,workerd
node n rea       rea-agents
node n ocr       @alibaba-group/open-code-review   --allow-scripts=@alibaba-group/open-code-review

# ── py（uv）─────────────────────────────────────────────────────
py   y ruff      ruff
py   y yt-dlp    yt-dlp

# ── go ─────────────────────────────────────────────────────────
go   y gopls     golang.org/x/tools/gopls
go   y gofumpt   mvdan.cc/gofumpt
