# 不开 fix，避免门禁改写工作区。
# target-version 用 py39：py314 会让 format 产出 3.14-only 语法（PEP 758）。
# 注意：format 默认会同时检查并格式化 Markdown（*.md）内的 ```python 代码块。

target-version = "py39"
line-length = 100
extend-exclude = ["_vendor"]  # 子模块

[lint]
select = [
    "E",   # PEP 8 style errors
    "W",   # PEP 8 style warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行超长
    "RUF001", # 字符串内全角标点
    "RUF002", # 文档字符串内全角标点
    "RUF003", # 注释内全角标点
]
