[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
# license = "MIT"              # PEP 639: SPDX 表达式（按需填写许可证）
# license-files = ["LICENSE"]  # PEP 639: 随包携带的许可证文件

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # PEP 8 style errors
    "W",   # PEP 8 style warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF002", # ambiguous unicode character in docstring
    "RUF003", # ambiguous unicode character in comment
]

[tool.pytest.ini_options]
addopts = ["-ra", "-q", "--strict-markers", "--strict-config", "--tb=short"]
