name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python tools
        run: |
          uv tool install 'ruff==0.16.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck stow zsh tmux ripgrep

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck stow tmux ripgrep

      - name: Run shell linter (ShellCheck)
        run: make lint-shell

      - name: Run Python linter (ruff)
        run: make lint-python

      - name: Run shell syntax and behavior tests
        run: make test-shell

      - name: Run skill Python tests
        run: make test-skills
