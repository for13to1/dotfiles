# Dependabot — 仅看管 CI 中的 GitHub Actions 版本,自动升 PR
# 仓库本身无锁文件(managed by brew/apt/pacman),无其他生态可管。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
